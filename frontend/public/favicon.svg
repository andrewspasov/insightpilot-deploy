<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ip-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#140c2a"/>
    </linearGradient>
    <linearGradient id="ip-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a63"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ip-visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ip-bg)"/>
  <!-- ear cups -->
  <rect x="7" y="26" width="6" height="14" rx="3" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="51" y="26" width="6" height="14" rx="3" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <!-- helmet shell -->
  <path d="M32 5.5c13.6 0 22 9.2 22 22.4v9.4c0 6-3.8 9.8-9.4 11.1L32 51l-12.6-2.6C13.8 47.1 10 43.3 10 37.3v-9.4C10 14.7 18.4 5.5 32 5.5Z" fill="url(#ip-shell)" stroke="#22d3ee" stroke-width="1.7"/>
  <!-- visor rim -->
  <path d="M13.8 25.2C18 19.8 24.6 17.6 32 17.6s14 2.2 18.2 7.6" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- B-2 flying-wing emblem -->
  <path d="M32 9.6l9.2 4.5-2.9.1-2.1 1.5L32 13.9l-4.2 1.8-2.1-1.5-2.9-.1Z" fill="#22d3ee"/>
  <!-- visor -->
  <path d="M15 28.6c0-4.2 3-6.8 7.2-6.8h19.6c4.2 0 7.2 2.6 7.2 6.8v4.4c0 4.2-3.1 7-7.3 7H22.3c-4.2 0-7.3-2.8-7.3-7Z" fill="url(#ip-visor)"/>
  <!-- visor glint -->
  <path d="M20.4 25.6c3.8-1 7.7-1.3 11.4-1.1" stroke="#fff" stroke-opacity=".8" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <!-- oxygen mask -->
  <path d="M25.2 41.8h13.6c-.4 5.6-2.8 9.8-6.8 11.6-4-1.8-6.4-6-6.8-11.6Z" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M28.8 47.2h6.4" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
  <!-- hose, curving off to the side -->
  <path d="M36.2 50.6c3.4 1.4 6.6 3.8 8.6 7.6" stroke="#a855f7" stroke-width="2.4" stroke-linecap="round" fill="none"/>
</svg>
